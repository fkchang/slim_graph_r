<svg xmlns="http://www.w3.org/2000/svg" id="benchmark" class="sgr-diagram" data-sgr-theme="light" data-sgr-style="editorial" role="img" aria-labelledby="benchmark-title benchmark-desc" viewBox="0 0 768 764" width="768" height="764" style="display:block;margin:0 auto;width:100%;height:auto;max-width:768px;min-width:661px"><title id="benchmark-title">Publishing</title><desc id="benchmark-desc">flowchart. Draft; Decision: Ready?; Publish; Revise. Connections: Draft to Ready?; Ready? to Publish: Yes; Ready? to Revise: No.</desc><style>#benchmark{--sgr-paper:#f5f5f5;--sgr-secondary:#ececec;--sgr-ink:#2d3142;--sgr-muted:#4f5d75;--sgr-rule:#bfc0c0;--sgr-accent:#a83f18;--sgr-tint:#f8e7df;color:var(--sgr-ink);font-family:Geist,'Helvetica Neue',Arial,sans-serif}

#benchmark text{fill:var(--sgr-ink);font-size:14px}
#benchmark .sgr-title{font-family:'Instrument Serif',Georgia,serif;font-size:30px;font-weight:400}
#benchmark .sgr-name{font-weight:600}
#benchmark .sgr-detail,#benchmark .sgr-label{fill:var(--sgr-muted);font-size:12px}
#benchmark .sgr-zone{fill:var(--sgr-muted);font-size:12px;font-weight:600}
#benchmark .sgr-event-title{font-family:'Instrument Serif',Georgia,serif;font-size:18px}
#benchmark .sgr-event-detail{fill:var(--sgr-muted);font-size:14px}
#benchmark .sgr-date{font-family:'Geist Mono',ui-monospace,monospace;fill:var(--sgr-muted);font-size:12px}
#benchmark .sgr-emphasis{fill:var(--sgr-accent)}
</style><defs><marker id="benchmark-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 1 1 L 7 4 L 1 7 Z" fill="var(--sgr-muted)" stroke="var(--sgr-muted)" stroke-width="1.2"/></marker></defs><rect x="0" y="0" width="768" height="764" fill="var(--sgr-paper)"/><text x="40" y="48" class="sgr-title">Publishing</text><line x1="40" y1="76" x2="728" y2="76" stroke="var(--sgr-rule)" stroke-width="1"/><g transform="translate(0 84)"><path data-sgr-connector="true" data-sgr-hops="0" d="M 208 160 L 208 264.0" fill="none" stroke="var(--sgr-muted)" stroke-width="1.2" marker-end="url(#benchmark-arrow)"/> <path data-sgr-connector="true" data-sgr-hops="0" d="M 352.0 336 L 464 336" fill="none" stroke="var(--sgr-muted)" stroke-width="1.2" marker-end="url(#benchmark-arrow)"/> <path data-sgr-connector="true" data-sgr-hops="0" d="M 208 408.0 L 208 512" fill="none" stroke="var(--sgr-muted)" stroke-width="1.2" marker-end="url(#benchmark-arrow)"/> <rect x="96" y="72" width="224" height="88" rx="6" fill="var(--sgr-paper)" stroke="var(--sgr-ink)" stroke-width="1" data-sgr-shape="step"/><text x="116" y="122" text-anchor="start" class="sgr-name">Draft</text><polygon data-sgr-shape="decision" points="208,264.0 352.0,336 208,408.0 64.0,336" fill="var(--sgr-tint)" stroke="var(--sgr-accent)" stroke-width="1"/><text x="208" y="342" text-anchor="middle" class="sgr-name sgr-emphasis">Ready?</text><rect x="464" y="292" width="224" height="88" rx="6" fill="var(--sgr-paper)" stroke="var(--sgr-ink)" stroke-width="1" data-sgr-shape="step"/><text x="484" y="342" text-anchor="start" class="sgr-name">Publish</text><rect x="96" y="512" width="224" height="88" rx="6" fill="var(--sgr-paper)" stroke="var(--sgr-ink)" stroke-width="1" data-sgr-shape="step"/><text x="116" y="562" text-anchor="start" class="sgr-name">Revise</text><rect x="386" y="300" width="44" height="28" rx="4" fill="var(--sgr-paper)"/><text x="408" y="316" class="sgr-label" text-anchor="middle">Yes</text><rect x="216" y="446" width="36" height="28" rx="4" fill="var(--sgr-paper)"/><text x="234" y="462" class="sgr-label" text-anchor="middle">No</text></g></svg>