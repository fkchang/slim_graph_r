name: RSpec and package checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.1', '3.2', '3.3', '3.4', '4.0']
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: gemfiles/core.gemfile
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec --exclude-pattern 'spec/{integration,local}/**/*_spec.rb'
      - run: ruby bin/check-package
  stream-weaver:
    strategy:
      fail-fast: false
      matrix:
        source: [release, git]
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: gemfiles/integration.gemfile
      STREAM_WEAVER_SOURCE: ${{ matrix.source }}
      STREAM_WEAVER_VERSION: '= 0.3.2'
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          cache-version: ${{ matrix.source }}
      - run: bundle exec rspec spec/integration
